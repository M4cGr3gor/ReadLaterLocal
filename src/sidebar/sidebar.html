<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName">Read Later Local</title>
  <link rel="stylesheet" href="../lib/base.css">
  <link rel="stylesheet" href="sidebar.css">
  <script type="module" src="sidebar.js"></script>
</head>
<body>
  <header class="head">
    <label class="search">
      <span class="search-icon" id="search-icon"></span>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
    </label>
    <div id="page-state" class="page-state" hidden></div>
    <div class="filters" role="tablist">
      <button class="chip" role="tab" data-status="unread"><span data-i18n="filterUnread"></span> <span class="count" data-count="unread"></span></button>
      <button class="chip" role="tab" data-status="favorite"><span data-i18n="filterFavorite"></span> <span class="count" data-count="favorite"></span></button>
      <button class="chip" role="tab" data-status="all"><span data-i18n="filterAll"></span> <span class="count" data-count="all"></span></button>
    </div>
  </header>
  <ul id="items" class="items"></ul>
  <p id="empty" class="empty" hidden></p>
  <div id="sentinel" class="sentinel"></div>
  <footer class="foot">
    <span class="hint" data-i18n="sidebarHint"></span>
    <button id="view-all" class="link" type="button" data-i18n="viewAll"></button>
  </footer>
  <div id="toasts" class="toast-area"></div>
</body>
</html>
