<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../lib/base.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="mini">
  <div id="status" class="status" hidden></div>
  <div class="section-label" data-i18n="recent"></div>
  <ul id="recent" class="recent"></ul>
  <div id="empty" class="empty" hidden>
    <strong data-i18n="emptyRecentTitle"></strong>
    <p data-i18n="emptyRecentBody"></p>
  </div>
  <footer class="footer">
    <button id="view-all" class="link" type="button" data-i18n="viewAll"></button>
    <span class="footer-actions">
      <button id="export" class="icon-btn" type="button" data-i18n-title="export"></button>
      <button id="import" class="icon-btn" type="button" data-i18n-title="import"></button>
      <button id="data" class="icon-btn" type="button" data-i18n-title="dataPage"></button>
    </span>
  </footer>
</body>
</html>
